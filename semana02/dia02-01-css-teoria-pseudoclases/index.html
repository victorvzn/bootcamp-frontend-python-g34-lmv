<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Teoria</title>
  <style>
    /* Pseudoclases */

    button {
      background-color: tomato;
    }

    button:hover {
      background-color: seagreen;
      cursor: pointer;
    }

    input:focus {
      outline: 3px solid gold;
    }

    button:disabled {
      background-color: lightgray;
    }

    input:checked {
      outline: 2px solid red;
    }

    /* Pseudoelementos */

    .tip::before {
      content: "💡 ";
    }

    .obligatorio::after {
      content: " *";
      color: red;
    }

    input::placeholder {
      color: blue;
    }

    ::selection {
      background-color: gold;
      color: blue;
    }

    /* Selectores combinados */

    /* Selector descendiente - NO USARLO SOLO ESTÁ COMO REFERENCIA */

    article p {
      border: 1px solid red;
    }

    /* Selectores de hijo directo > - NO USARLO SOLO ESTÁ COMO REFERENCIA */

    article > strong {
      color: red;
    }

    p > strong {
      color: blue;
    }

    /*  */
  </style>
</head>
<body>
  <h1>Pseudoclases</h1>

  <p>Pasa el cursor por el botón y haz clic en el campo.</p>
  <input type="text" placeholder="Escribe aquí" />
  <button>Enviar</button>
  <button disabled>No disponible</button>
  <input type="checkbox"> Apagado

  <h1>Pseudoelementos</h1>

  <p class="tip">Guarda tus archivos con frecuencia.</p>
  <p class="obligatorio">Correo</p>

  <input type="text" placeholder="¿Hola, como estas?" />

  <h1>Selectores combinados</h1>

  <article>
    <h2>Bienvenido</h2>
    <p>Mi párrafo</p>
    <p>Segundo párrafo con <strong>texto importante</strong>.</p>
  </article>

  <section>
    <p>Otro párrafo fuera en un section</p>
  </section>
</body>
</html>
