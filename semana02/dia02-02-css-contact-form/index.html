<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact form</title>
</head>
<body>
  <main>
    <h1>Contact Us</h1>

    <form>
      <div>
        <label>
          First Name
        </label>

        <label>
          Last Name
        </label>
      </div>

      <label>
        Email Address
      </label>

      <div>
        Query Type
        General Enquiry
        Support Request
      </div>

      <label>
        Message
      </label>

      <label>
        I consent to being contacted by the team
      </label>

      <input type="submit" value="Submit" />
    </form>
  </main>
</body>
</html>
